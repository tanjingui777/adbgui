<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>守卫农庄 · QQ宠物经典游戏复原</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #1a1a2e;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    user-select: none;
  }

  #stage {
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse at 50% 30%, rgba(255,200,100,0.08) 0%, transparent 60%),
      linear-gradient(180deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
    display: flex; align-items: center; justify-content: center;
  }

  #game-container {
    position: relative;
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
  }

  .flash-window {
    position: absolute;
    background: transparent;
    border: none;
    overflow: hidden;
  }
  .flash-window ruffle-player {
    width: 100%; height: 100%;
  }

  #main-game {
    position: relative;
    width: min(90vw, 900px);
    aspect-ratio: 4/3;
    max-height: 85vh;
    box-shadow: 0 0 60px rgba(255,180,50,0.15), 0 20px 60px rgba(0,0,0,0.6);
    border-radius: 8px;
    overflow: hidden;
    background: #2d1b0e;
  }

  #title-bar {
    position: absolute; top: 0; left: 0; right: 0;
    height: 36px;
    background: linear-gradient(180deg, rgba(45,27,14,0.95), rgba(45,27,14,0.85));
    border-bottom: 1px solid rgba(255,180,50,0.2);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 12px;
    z-index: 100;
    backdrop-filter: blur(4px);
  }
  #title-bar .title {
    color: #ffd479; font-size: 14px; font-weight: bold;
    text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    letter-spacing: 2px;
  }
  #title-bar .controls { display: flex; gap: 8px; align-items: center; }
  #title-bar button {
    background: rgba(255,180,50,0.15);
    border: 1px solid rgba(255,180,50,0.3);
    color: #ffd479;
    padding: 4px 10px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
    transition: all 0.2s;
  }
  #title-bar button:hover { background: rgba(255,180,50,0.3); }

  #version-select {
    background: rgba(45,27,14,0.9);
    border: 1px solid rgba(255,180,50,0.3);
    color: #ffd479;
    padding: 3px 6px;
    border-radius: 4px;
    font-size: 12px;
    cursor: pointer;
  }

  #status-bar {
    position: absolute; bottom: 0; left: 0; right: 0;
    height: 32px;
    background: linear-gradient(0deg, rgba(45,27,14,0.95), rgba(45,27,14,0.7));
    border-top: 1px solid rgba(255,180,50,0.2);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 12px;
    z-index: 100;
    font-size: 12px; color: #b8a070;
  }
  #status-bar .stat { display: flex; gap: 16px; }
  #status-bar .stat span b { color: #ffd479; font-weight: normal; }

  #loading {
    position: fixed; inset: 0;
    background: #1a1a2e;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 9999;
    transition: opacity 0.5s;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }
  #loading .logo {
    font-size: 32px; color: #ffd479;
    margin-bottom: 16px;
    text-shadow: 0 0 20px rgba(255,180,50,0.5);
    letter-spacing: 8px;
  }
  #loading .sub { color: #8a7a5a; font-size: 14px; margin-bottom: 24px; }
  .spinner {
    width: 40px; height: 40px;
    border: 3px solid rgba(255,180,50,0.2);
    border-top-color: #ffd479;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #log-panel {
    position: fixed; bottom: 40px; right: 12px;
    width: 320px; max-height: 240px;
    background: rgba(0,0,0,0.75);
    border: 1px solid rgba(255,180,50,0.2);
    border-radius: 6px;
    padding: 8px;
    font-size: 11px; color: #8a7a5a;
    overflow-y: auto;
    z-index: 200;
    display: none;
    font-family: "Consolas", monospace;
  }
  #log-panel.show { display: block; }
  #log-panel .line { padding: 1px 0; border-bottom: 1px solid rgba(255,255,255,0.03); }
  #log-panel .line.api { color: #7ec8e3; }
  #log-panel .line.event { color: #ff9f43; }
  #log-panel .line.window { color: #a8e6cf; }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,180,50,0.3); border-radius: 3px; }
</style>
</head>
<body>

<div id="loading">
  <div class="logo">守卫农庄</div>
  <div class="sub">QQ宠物经典游戏 · 原版复原</div>
  <div class="spinner"></div>
</div>

<div id="stage">
  <div id="game-container">
    <div id="main-game">
      <div id="title-bar">
        <span class="title">🌾 守卫农庄 · 点击宠物跳起躲避老鼠</span>
        <div class="controls">
          <select id="version-select" title="选择版本">
            <option value="main_123.swf">v1.2.3 (最新)</option>
            <option value="main_122.swf">v1.2.2</option>
            <option value="main_113.swf">v1.1.3</option>
            <option value="main_112.swf">v1.1.2</option>
            <option value="main_103.swf">v1.0.3</option>
            <option value="main_102.swf">v1.0.2</option>
          </select>
          <button id="btn-restart">重新开始</button>
          <button id="btn-log">日志</button>
        </div>
      </div>
      <div id="flash-area" style="position:absolute; top:36px; bottom:32px; left:0; right:0;">
        <div id="main-flash" class="flash-window" style="position:relative; width:100%; height:100%;"></div>
      </div>
      <div id="status-bar">
        <div class="stat">
          <span>躲过老鼠: <b id="s-count">0</b></span>
          <span>心情: <b id="s-mood">--</b></span>
        </div>
        <span id="s-info">准备中...</span>
      </div>
    </div>
  </div>
</div>

<div id="log-panel"></div>

<script src="ruffle/ruffle.js"></script>
<script>
// ============ Ruffle 配置 ============
window.RufflePlayer.config = {
  allowScriptAccess: true,
  autoplay: "on",
  backgroundColor: "#2d1b0e",
  letterbox: "off",
  scale: "showAll",
  quality: "high",
  wmode: "opaque",
  logLevel: "warn",
  contextMenu: "off",
  openUrlMode: "allow",
  playerVersion: 32,
  base: "",
  menu: false
};
const ruffle = window.RufflePlayer.newest();

// ============ 日志 ============
const logPanel = document.getElementById('log-panel');
function log(msg, type='') {
  const line = document.createElement('div');
  line.className = 'line ' + type;
  const t = new Date().toLocaleTimeString();
  line.textContent = `[${t}] ${msg}`;
  logPanel.appendChild(line);
  logPanel.scrollTop = logPanel.scrollHeight;
  while (logPanel.children.length > 100) logPanel.removeChild(logPanel.firstChild);
}
document.getElementById('btn-log').onclick = () => logPanel.classList.toggle('show');

// ============ 游戏状态 ============
const gameState = {
  count: 0, mood: 0,
  windows: {},
  mainPlayer: null,
  registeredFunctions: {},
  scale: 1,
  windowX: 0, windowY: 0
};

function callRegistered(name, ...args) {
  const fn = gameState.registeredFunctions[name];
  if (typeof fn === 'function') {
    try { return fn(...args); } catch(e) { log(`callRegistered ${name} error: ${e}`, 'api'); }
  }
  return null;
}

function updateStatus() {
  document.getElementById('s-count').textContent = gameState.count;
  document.getElementById('s-mood').textContent = gameState.mood;
}

// ============ API 桥接 ============
function handleAPICall(name, ...args) {
  if (name.startsWith('API.')) {
    const func = name.substring(4);
    if (window.API[func]) return window.API[func](...args);
  } else if (name.startsWith('APIEvent.')) {
    const evt = name.substring(9);
    if (window.APIEvent[evt]) return window.APIEvent[evt](...args);
  }
  log(`未知调用: ${name}(${args.join(',')})`, 'api');
  return null;
}

// 窗口名常量（与 SWF 内部一致）
const WN = {
  RAT: 'WND_NAME_RAT',
  STATUS_COUNT: 'WND_NAME_STATUS_COUNT',
  STATUS_MOOD: 'WND_NAME_STATUS_MOOD',
  PROMPT_MOOD: 'WND_NAME_PROMPT_MOOD',
  PROMPT_MONEY: 'WND_NAME_PROMPT_MOENY'  // 注意：原版拼写就是 MOENY
};

window.API = {
  CreateWindow(name, x, y, w, h, param6, swfName) {
    log(`CreateWindow: ${name} <- ${swfName} at (${x},${y}) ${w}x${h}`, 'window');
    createSubWindow(name, swfName, x, y, w, h);
    return name;
  },
  DestroyWindow(name) {
    if (name == null || name === '' || name === 'undefined') {
      // 无参数时销毁所有子窗口
      log('DestroyWindow: 销毁所有子窗口', 'window');
      Object.keys(gameState.windows).forEach(destroySubWindow);
      return 1;
    }
    log(`DestroyWindow: ${name}`, 'window');
    destroySubWindow(name);
    return 1;
  },
  MoveTo(x, y, name) {
    // 注意：SWF 调用 API.moveTo(x, y) 或 API.moveTo(x, y, name)
    if (typeof y === 'string') { name = y; y = x; x = arguments[0]; }
    const w = gameState.windows[name];
    if (w) { w.element.style.left = x + 'px'; w.element.style.top = y + 'px'; }
    return 1;
  },
  MoveBy(dx, dy, name) {
    // SWF 调用 API.moveBy(dx, dy) 或 API.moveBy(dx, dy, name)
    if (name == null) {
      // 无窗口名时，移动所有子窗口（原版 onWindowMove 行为）
      for (const n in gameState.windows) {
        const w = gameState.windows[n];
        w.element.style.left = (parseFloat(w.element.style.left) + (dx||0)) + 'px';
        w.element.style.top = (parseFloat(w.element.style.top) + (dy||0)) + 'px';
      }
      return 1;
    }
    const w = gameState.windows[name];
    if (w) {
      w.element.style.left = (parseFloat(w.element.style.left) + (dx||0)) + 'px';
      w.element.style.top = (parseFloat(w.element.style.top) + (dy||0)) + 'px';
    }
    return 1;
  },
  ResizeWindow(w, h, name) {
    const win = gameState.windows[name];
    if (win) { win.element.style.width = w + 'px'; win.element.style.height = h + 'px'; }
    return 1;
  },
  SetWindow(name, param2, param3) {
    // 简化处理
    return 0;
  },
  Show(visible, name) {
    if (name == null) {
      // 无窗口名时设置主窗口
      return 1;
    }
    const w = gameState.windows[name];
    if (w) w.element.style.display = visible ? 'block' : 'none';
    return 1;
  },
  GetWindowRect(name) {
    const w = gameState.windows[name];
    if (w) {
      const area = document.getElementById('flash-area');
      const areaRect = area.getBoundingClientRect();
      const r = w.element.getBoundingClientRect();
      return `${r.left - areaRect.left},${r.top - areaRect.top},${r.width},${r.height}`;
    }
    return '0,0,0,0';
  },
  GetWindowPosition(flag) {
    // 返回主窗口相对于桌面的位置
    const area = document.getElementById('flash-area');
    const r = area.getBoundingClientRect();
    return `${Math.round(r.left)},${Math.round(r.top)}`;
  },
  GetWindowName(option) {
    // option: 0=parent, 1=children
    if (option === 1 || option === 'CHILDREN') {
      return Object.keys(gameState.windows);
    }
    return 'main';
  },
  GetCursorPosition(flag) {
    const area = document.getElementById('flash-area');
    if (area) {
      const r = area.getBoundingClientRect();
      return `${Math.round(cursorPos.x - r.left)},${Math.round(cursorPos.y - r.top)}`;
    }
    return `${cursorPos.x},${cursorPos.y}`;
  },
  GetFlashFileSize(name) {
    return '140,140';
  },
  GetScalable() { return gameState.scale; },
  SetScalable(scale, name) {
    gameState.scale = scale;
    return 1;
  },
  EnableDrag(enable, name) { return 1; },
  IsEnableDrag(name) { return 0; },
  IsVisible(name) {
    if (name == null) return 1;
    const w = gameState.windows[name];
    return w ? (w.element.style.display !== 'none' ? 1 : 0) : 1;
  },
  RemoteCall(name, func, ...args) {
    log(`RemoteCall: ${name}.${func}(${args.join(',')})`, 'api');

    // 处理计数更新
    if (func === 'CountStatus.onCountUpdate') {
      gameState.count = args[0] || 0;
      updateStatus();
    }
    // 处理心情更新
    if (func === 'MoodStatus.onMoodUpdate') {
      gameState.mood = args[0];
      updateStatus();
    }

    const w = gameState.windows[name];
    if (w && w.player) {
      // 等待回调注册后调用
      let attempts = 0;
      const tryCall = () => {
        attempts++;
        if (typeof w.player[func] === 'function') {
          try { return w.player[func](...args); } catch(e) {}
        } else if (attempts < 30) {
          setTimeout(tryCall, 100);
        }
      };
      tryCall();
    }
    return null;
  },
  registerFunction(name, handler) {
    log(`registerFunction: ${name}`, 'api');
    gameState.registeredFunctions[name] = handler;
    return 0;
  }
};

// 全局鼠标位置
let cursorPos = { x: 0, y: 0 };
document.addEventListener('mousemove', e => {
  cursorPos.x = e.clientX;
  cursorPos.y = e.clientY;
});

// ============ 事件分发 ============
window.APIEvent = {
  OnHitScreen(x, y) {},
  OnHitWindow(name, x, y) {},
  OnMouseMove(x, y) {},
  OnWindowMove(name, x, y) {},
  OnPlay() {
    log('OnPlay: 游戏开始播放', 'event');
    document.getElementById('s-info').textContent = '点击宠物开始游戏！';
  }
};

// 将 API 注册到 window 上供 ExternalInterface 查找
function registerWindowAPIs() {
  ['CreateWindow','DestroyWindow','MoveTo','MoveBy','ResizeWindow','SetWindow','Show',
   'GetWindowRect','GetWindowPosition','GetWindowName','GetCursorPosition',
   'GetFlashFileSize','GetScalable','SetScalable','EnableDrag','IsEnableDrag','IsVisible',
   'RemoteCall','registerFunction']
  .forEach(fn => {
    const orig = window.API[fn];
    window['API.' + fn] = function(...args) {
      try { return orig.apply(this, args); } catch(e) { throw e; }
    };
  });
  ['OnHitScreen','OnHitWindow','OnMouseMove','OnWindowMove','OnPlay']
  .forEach(fn => {
    const orig = window.APIEvent[fn];
    window['APIEvent.' + fn] = function(...args) {
      try { return orig.apply(this, args); } catch(e) { throw e; }
    };
  });
}
registerWindowAPIs();

// ============ TICKLE 相关 API ============
// TICKLE_GetFeeling 返回宠物心情值
window.TICKLE_GetFeeling = function() {
  log('TICKLE_GetFeeling called', 'api');
  // 返回 { feelTotal, feelNow }
  return { feelTotal: 1000, feelNow: 500 };
};
window.TICKLE_SendAction = function(actionType, value) {
  log(`TICKLE_SendAction: type=${actionType} value=${value}`, 'api');
  return 0;
};

// ============ 子窗口管理 ============
function createSubWindow(name, swfName, x, y, w, h) {
  if (gameState.windows[name]) {
    destroySubWindow(name);
  }

  const area = document.getElementById('flash-area');
  const areaRect = area.getBoundingClientRect();

  const div = document.createElement('div');
  div.className = 'flash-window';
  div.style.cssText = `position:absolute; left:${x}px; top:${y}px; width:${w||200}px; height:${h||200}px; z-index:50;`;
  div.dataset.name = name;

  const player = ruffle.createPlayer();
  player.style.width = '100%';
  player.style.height = '100%';
  player.callExternalInterface = function(cbName, args) {
    return handleAPICall(cbName, ...(args || []));
  };
  player.onFSCommand = function(cmd, args) {
    console.log('[sub-FSCommand][' + name + ']', cmd, args);
  };
  div.appendChild(player);

  area.appendChild(div);
  gameState.windows[name] = { element: div, player };

  player.load(swfName).then(() => {
    log(`子窗口 ${name} 加载完成: ${swfName}`, 'window');
    // 通知主窗口子窗口已创建
    if (gameState.mainPlayer && gameState.mainPlayer['Main.onWindowCreate']) {
      gameState.mainPlayer['Main.onWindowCreate'](name);
    }
  }).catch(err => {
    log(`子窗口加载失败 ${name}: ${err}`, 'window');
  });

  return div;
}

function destroySubWindow(name) {
  const w = gameState.windows[name];
  if (w) {
    w.element.remove();
    delete gameState.windows[name];
  }
}

// ============ 主游戏加载 ============
function loadMainGame(swfName) {
  const mainFlash = document.getElementById('main-flash');
  mainFlash.innerHTML = '';
  Object.keys(gameState.windows).forEach(destroySubWindow);
  gameState.count = 0; gameState.mood = 0;
  updateStatus();
  document.getElementById('s-info').textContent = '加载中...';

  const player = ruffle.createPlayer();
  player.style.width = '100%';
  player.style.height = '100%';
  player.callExternalInterface = function(cbName, args) {
    return handleAPICall(cbName, ...(args || []));
  };

  // 拦截 SWF 注册的回调
  if (player.onCallbackAvailable) {
    const origOnCallback = player.onCallbackAvailable.bind(player);
    player.onCallbackAvailable = function(name) {
      log(`SWF注册回调: ${name}`, 'api');
      const ret = origOnCallback(name);
      // 当 TICKLE_OnResult 注册后，调用它启动游戏
      if (name === 'TICKLE_OnResult') {
        setTimeout(() => {
          try {
            player['TICKLE_OnResult'](0, 500);
            log('已调用 TICKLE_OnResult(0, 500)', 'api');
          } catch(e) { log('TICKLE_OnResult error: ' + e, 'api'); }
        }, 300);
      }
      return ret;
    };
  } else {
    setTimeout(() => {
      if (player['TICKLE_OnResult']) {
        try {
          player['TICKLE_OnResult'](0, 500);
          log('已调用 TICKLE_OnResult(0, 500)', 'api');
        } catch(e) {}
      }
    }, 2000);
  }

  // FSCommand 处理 - 游戏结束时自动重启
  player.onFSCommand = function(cmd, args) {
    log(`FSCommand: ${cmd} ${args||''}`, 'event');
    if (cmd === 'quit') {
      log('游戏结束，自动重启...', 'event');
      document.getElementById('s-info').textContent = '游戏结束，重新开始...';
      setTimeout(() => loadMainGame(document.getElementById('version-select').value), 1500);
    }
  };

  mainFlash.appendChild(player);
  gameState.mainPlayer = player;

  player.load(swfName).then(() => {
    log(`主游戏加载完成: ${swfName}`);
    document.getElementById('s-info').textContent = '点击宠物开始游戏！';
    setTimeout(() => {
      document.getElementById('loading').classList.add('hidden');
    }, 500);
  }).catch(err => {
    log(`主游戏加载失败: ${err}`);
    document.getElementById('s-info').textContent = '加载失败: ' + err;
    document.getElementById('loading').classList.add('hidden');
  });
}

// ============ 控制按钮 ============
document.getElementById('version-select').addEventListener('change', e => {
  loadMainGame(e.target.value);
});
document.getElementById('btn-restart').addEventListener('click', () => {
  loadMainGame(document.getElementById('version-select').value);
});

// ============ 启动 ============
window.addEventListener('load', () => {
  if (window.RufflePlayer) {
    loadMainGame('main_123.swf');
  } else {
    window.addEventListener('ruffle-ready', () => loadMainGame('main_123.swf'));
  }
});
</script>
</body>
</html>
